<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TRoyGO™ Trip Planner</title>
<style>
  :root {
    --navy: #0A1628;
    --navy-light: #152D55;
    --teal: #00B4D8;
    --gold: #FFD700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 420px;
    height: 640px;
    font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header img { width: 28px; height: 28px; border-radius: 50%; }
  header .brand { display: flex; flex-direction: column; line-height: 1.15; }
  header .brand .name {
    font-weight: 800;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: -0.01em;
  }
  header .brand .sub {
    font-size: 8.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--teal);
  }
  nav {
    display: flex;
    gap: 4px;
    padding: 6px 8px;
    background: #f4f6f8;
    border-bottom: 1px solid #e5e7eb;
    flex-shrink: 0;
    overflow-x: auto;
  }
  nav button {
    border: none;
    background: transparent;
    color: #4b5563;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 9px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  nav button:hover { background: #e9edf1; }
  nav button.active {
    background: var(--navy);
    color: #fff;
  }
  .frame-wrap { flex: 1; position: relative; }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  footer {
    padding: 7px 12px;
    background: #f4f6f8;
    border-top: 1px solid #e5e7eb;
    font-size: 10.5px;
    color: #6b7280;
    text-align: center;
    flex-shrink: 0;
  }
  footer a { color: var(--teal); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="TRoyGO logo" />
    <div class="brand">
      <span class="name">TRoyGO™</span>
      <span class="sub">TRoy Travel Agency™</span>
    </div>
  </header>

  <nav id="tabs">
    <button data-path="/trip-planner" class="active">Trip Planner</button>
    <button data-path="/flights">Flights</button>
    <button data-path="/hotels">Hotels</button>
    <button data-path="/packages">Packages</button>
    <button data-path="/">Home</button>
  </nav>

  <div class="frame-wrap">
    <iframe id="troygoFrame" src="https://troytravelagency.com/trip-planner" title="TRoyGO Trip Planner"></iframe>
  </div>

  <footer>
    Live on <a href="https://troytravelagency.com" target="_blank" rel="noopener">troytravelagency.com</a> — open full site ↗
  </footer>

  <script src="popup.js"></script>
</body>
</html>
