name: Travel Research Agents

# Runs TRoyGO's real research agents (packages, hotels, cars, cruises) when
# started by hand (no schedule since 2026-10-23). Each script does real web searches (Serper) + real LLM calls
# (Anthropic) and only writes confirmed, sourced listings; see
# troygo/agents/travel_research/README.md for the full design.
#
# Needs these repo secrets (Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY
#   SERPER_API_KEY
#   BACKEND_API_KEY   (optional — lets the cruise run ask TRoyAI's Finance
#                      department to set real markup/campaign flags instead
#                      of the static fallback table; only works when
#                      backend.troyaiagent.com is actually reachable, i.e.
#                      TRoy's laptop backend+tunnel are running — safe either
#                      way, falls back automatically if not)

on:
  # The daily schedule (02:00 UTC) was REMOVED 2026-10-23 on TRoy's instruction:
  # every run spends real Anthropic + Serper credit. Runs are manual only, from
  # the Actions tab or the dashboard's Research Agents page.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: troygo/agents/travel_research
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Research packages
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python run.py

      - name: Research hotels
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python run_hotels.py

      - name: Research cars
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python run_cars.py

      - name: Research cruises
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          BACKEND_URL: https://backend.troyaiagent.com
        run: python run_cruises.py

      - name: Commit and push real results
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "TRoyGO Research Agent"
          git config user.email "agent@troyaiagent.com"
          git add troygo/src/lib/data/*-live.json troygo/src/lib/data/agent-activity.json troygo/agents/travel_research/output/
          if git diff --cached --quiet; then
            echo "No new real listings found this run — nothing to commit."
          else
            git commit -m "Automated research run: refresh real travel data"
            git push
          fi
