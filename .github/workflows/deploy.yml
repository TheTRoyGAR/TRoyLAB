name: Deploy TRoyGO™ to Vercel

on:
  push:
    branches:
      - main
      - claude/ai-travel-agent-site-KfMzc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: troygo/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        working-directory: troygo
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
