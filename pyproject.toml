[project]
name = "troygo-agency"
version = "1.0.0"
description = "TRoyGO — AI-run travel agency (internal CEO command dashboard)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
troygo = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["agency"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
